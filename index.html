<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Digital Business Card</title>
<meta name="theme-color" content="#0d0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0f14'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Georgia,serif' fill='%235eead4' text-anchor='middle'%3ECA%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="card"><noscript>Enable JavaScript to view this card, or open <code>contact</code> details in the repository.</noscript></main>

  <script src="config.js"></script>
  <script src="card.js"></script>
  <script>
    (function () {
      var cfg = window.CARD_CONFIG || {};
      Card.applyMeta(cfg);
      Card.renderCard(cfg, document.getElementById("card"));
      // keep the favicon initials in sync with the config
      var initials = (cfg.initials || Card.initialsFrom(cfg.name) || "").toUpperCase();
      if (initials) {
        var fg = (cfg.theme && cfg.theme.accent2) ? cfg.theme.accent2 : "#5eead4";
        var svg = "data:image/svg+xml," + encodeURIComponent(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='#0d0f14'/><text x='50' y='68' font-size='54' font-family='Georgia,serif' fill='" + fg + "' text-anchor='middle'>" + initials + "</text></svg>");
        document.getElementById("favicon").setAttribute("href", svg);
      }
    })();
  </script>
</body>
</html>
