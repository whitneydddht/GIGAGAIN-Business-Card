<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Setup Wizard — Digital Business Card</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { display: block; padding: 0; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 18px 80px; }
  .lead { text-align: center; margin: 8px 0 26px; }
  .lead h1 { font-size: 24px; margin: 0 0 6px; }
  .lead p { color: var(--muted); margin: 0; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 26px; }
  @media (min-width: 860px) { .grid { grid-template-columns: 1.05fr 0.95fr; align-items: start; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent-2); margin: 0 0 14px; }
  .fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 16px; }
  .fieldset > legend { padding: 0 6px; color: var(--muted); font-size: 12px; letter-spacing: .4px; }
  label.f { display: block; margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  label.f span { display: block; margin-bottom: 5px; }
  input[type=text], input[type=url], input[type=tel], select {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: #12161e; color: var(--text); font-size: 14px; font-family: inherit;
  }
  input[type=color] { width: 46px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #12161e; vertical-align: middle; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .three { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .rowitem { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.02); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: #12161e; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.primary { border: none; background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--on-accent); }
  .btn.tiny { padding: 6px 10px; font-size: 12px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .chk { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .preview-wrap { position: sticky; top: 18px; }
  .preview-frame { display: flex; justify-content: center; padding: 8px 0 18px; }
  textarea#out { width: 100%; min-height: 190px; border-radius: 10px; border: 1px solid var(--line); background: #0f1319; color: #cfe9e4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 12px; resize: vertical; }
  .muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .ok { color: var(--accent-2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="lead">
    <h1>Business Card Setup</h1>
    <p>Fill this in, watch the live preview, then download your <code>config.js</code>. No coding.</p>
  </div>

  <div class="grid">
    <!-- ---------------- FORM ---------------- -->
    <div class="panel">
      <h2>Your details</h2>

      <fieldset class="fieldset"><legend>Identity</legend>
        <label class="f"><span>Live URL (your domain or GitHub Pages URL)</span><input id="url" type="url" placeholder="https://yourname.com/"></label>
        <div class="two">
          <label class="f"><span>Full name</span><input id="name" type="text" placeholder="Jane Doe"></label>
          <label class="f"><span>Initials (avatar)</span><input id="initials" type="text" maxlength="3" placeholder="JD"></label>
        </div>
        <div class="two">
          <label class="f"><span>Title</span><input id="title" type="text" placeholder="Founder"></label>
          <label class="f"><span>Organization</span><input id="org" type="text" placeholder="Acme Co."></label>
        </div>
        <label class="f"><span>Footer text</span><input id="footer" type="text" placeholder="YOURNAME.COM"></label>
      </fieldset>

      <fieldset class="fieldset"><legend>Theme</legend>
        <div class="btn-row">
          <label class="f" style="margin:0"><span>Main color</span><input id="accent" type="color" value="#14b8a6"></label>
          <label class="f" style="margin:0"><span>Light shade</span><input id="accent2" type="color" value="#5eead4"></label>
        </div>
      </fieldset>

      <fieldset class="fieldset"><legend>Phones</legend>
        <div id="phones"></div>
        <button class="btn tiny" type="button" data-add="phone">+ Add phone</button>
      </fieldset>

      <fieldset class="fieldset"><legend>Emails</legend>
        <div id="emails"></div>
        <button class="btn tiny" type="button" data-add="email">+ Add email</button>
      </fieldset>

      <fieldset class="fieldset"><legend>Links</legend>
        <div id="links"></div>
        <button class="btn tiny" type="button" data-add="link">+ Add link</button>
      </fieldset>
    </div>

    <!-- ---------------- PREVIEW + OUTPUT ---------------- -->
    <div class="preview-wrap">
      <div class="panel" style="margin-bottom:20px">
        <h2>Live preview</h2>
        <div class="preview-frame"><main id="preview"></main></div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn" type="button" id="test">Test “Save to Contacts”</button>
        </div>
      </div>
      <div class="panel">
        <h2>Your config.js</h2>
        <p class="muted">Download this and put it in your repo (replacing <code>config.js</code>), then commit.</p>
        <textarea id="out" readonly></textarea>
        <div class="btn-row">
          <button class="btn primary" type="button" id="download">Download config.js</button>
          <button class="btn" type="button" id="copy">Copy</button>
          <span class="chk"><span id="copied" class="ok"></span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="card.js"></script>
<script>
(function () {
  var ICON_OPTS = ["globe","linkedin","github","instagram","youtube","facebook","x","tool","calendar","location"];
  var $ = function (id) { return document.getElementById(id); };

  function phoneRow(p) {
    p = p || {};
    var d = document.createElement("div"); d.className = "rowitem"; d.dataset.kind = "phone";
    d.innerHTML =
      '<div class="two"><label class="f"><span>Label</span><input data-k="label" type="text" placeholder="Cell"></label>' +
      '<label class="f"><span>Shown as</span><input data-k="value" type="text" placeholder="(555) 123-4567"></label></div>' +
      '<div class="three"><label class="f"><span>Dials (E.164)</span><input data-k="dial" type="tel" placeholder="+15551234567"></label>' +
      '<label class="chk"><input data-k="primary" type="checkbox"> Primary</label>' +
      '<button class="btn tiny" type="button" data-del>Remove</button></div>';
    set(d, "label", p.label); set(d, "value", p.value); set(d, "dial", p.dial);
    if (p.primary) d.querySelector('[data-k="primary"]').checked = true;
    return d;
  }
  function emailRow(e) {
    e = e || {};
    var d = document.createElement("div"); d.className = "rowitem"; d.dataset.kind = "email";
    d.innerHTML =
      '<div class="three"><label class="f"><span>Label</span><input data-k="label" type="text" placeholder="Email"></label>' +
      '<label class="f"><span>Address</span><input data-k="value" type="text" placeholder="you@example.com"></label>' +
      '<button class="btn tiny" type="button" data-del>Remove</button></div>';
    set(d, "label", e.label); set(d, "value", e.value);
    return d;
  }
  function linkRow(l) {
    l = l || {};
    var d = document.createElement("div"); d.className = "rowitem"; d.dataset.kind = "link";
    var opts = ICON_OPTS.map(function (o) { return '<option value="' + o + '">' + o + "</option>"; }).join("");
    d.innerHTML =
      '<div class="two"><label class="f"><span>Label</span><input data-k="label" type="text" placeholder="Website"></label>' +
      '<label class="f"><span>Shown as</span><input data-k="value" type="text" placeholder="example.com"></label></div>' +
      '<div class="three"><label class="f"><span>URL</span><input data-k="url" type="url" placeholder="https://example.com"></label>' +
      '<label class="f"><span>Icon</span><select data-k="icon">' + opts + "</select></label>" +
      '<button class="btn tiny" type="button" data-del>Remove</button></div>';
    set(d, "label", l.label); set(d, "value", l.value); set(d, "url", l.url);
    if (l.icon) d.querySelector('[data-k="icon"]').value = l.icon;
    return d;
  }
  function set(scope, k, v) { var el = scope.querySelector('[data-k="' + k + '"]'); if (el) el.value = v || ""; }

  function readRows(containerId, keys) {
    return Array.prototype.map.call($(containerId).children, function (rowEl) {
      var obj = {};
      keys.forEach(function (k) {
        var el = rowEl.querySelector('[data-k="' + k + '"]');
        if (!el) return;
        obj[k] = el.type === "checkbox" ? el.checked : el.value;
      });
      return obj;
    });
  }

  function collect() {
    return {
      url: $("url").value.trim(),
      name: $("name").value.trim(),
      initials: $("initials").value.trim(),
      title: $("title").value.trim(),
      org: $("org").value.trim(),
      footer: $("footer").value.trim(),
      theme: { accent: $("accent").value, accent2: $("accent2").value, onAccent: "#03231f" },
      phones: readRows("phones", ["label", "value", "dial", "primary"]).filter(function (p) { return p.value || p.dial; }),
      emails: readRows("emails", ["label", "value"]).filter(function (e) { return e.value; }),
      links: readRows("links", ["label", "value", "url", "icon"]).filter(function (l) { return l.url; })
    };
  }

  function configText(cfg) { return "window.CARD_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n"; }

  function refresh() {
    var cfg = collect();
    Card.renderCard(cfg, $("preview"));
    $("out").value = configText(cfg);
  }

  // event wiring
  document.addEventListener("input", refresh);
  document.addEventListener("change", refresh);
  document.addEventListener("click", function (e) {
    if (e.target.matches("[data-add]")) {
      var kind = e.target.getAttribute("data-add");
      if (kind === "phone") $("phones").appendChild(phoneRow());
      if (kind === "email") $("emails").appendChild(emailRow());
      if (kind === "link") $("links").appendChild(linkRow());
      refresh();
    }
    if (e.target.matches("[data-del]")) { e.target.closest(".rowitem").remove(); refresh(); }
  });

  $("test").addEventListener("click", function () { Card.downloadVCard(collect()); });
  $("download").addEventListener("click", function () {
    var blob = new Blob([configText(collect())], { type: "text/javascript" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "config.js";
    document.body.appendChild(a); a.click(); a.remove();
  });
  $("copy").addEventListener("click", function () {
    navigator.clipboard.writeText(configText(collect())).then(function () {
      $("copied").textContent = "Copied!"; setTimeout(function () { $("copied").textContent = ""; }, 1600);
    });
  });

  // prefill from the existing config.js so you can edit your current card
  var c = window.CARD_CONFIG || {};
  $("url").value = c.url || ""; $("name").value = c.name || ""; $("initials").value = c.initials || "";
  $("title").value = c.title || ""; $("org").value = c.org || ""; $("footer").value = c.footer || "";
  if (c.theme) { if (c.theme.accent) $("accent").value = c.theme.accent; if (c.theme.accent2) $("accent2").value = c.theme.accent2; }
  (c.phones || [{}]).forEach(function (p) { $("phones").appendChild(phoneRow(p)); });
  (c.emails || [{}]).forEach(function (e) { $("emails").appendChild(emailRow(e)); });
  (c.links || [{}]).forEach(function (l) { $("links").appendChild(linkRow(l)); });
  refresh();
})();
</script>
</body>
</html>
